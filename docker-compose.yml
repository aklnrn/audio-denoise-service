services:
  redis:
    image: redis:7-alpine
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPUS:-1.0}

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    command: celery -A worker.celery_app.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./data:/app/data
      - ~/.cache/torch:/root/.cache/torch
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: ${WORKER_MEMORY_LIMIT:-4g}
    cpus: ${WORKER_CPUS:-2.0}
